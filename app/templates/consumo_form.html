{% extends "base.html" %}
{% block title %}Punto de Uso - Elegant Essence{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-pink-100">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">✨ Registro de Consumo (Punto de Uso)</h2>
        <p class="text-xs text-gray-500 mt-1">Escanea con la cámara de tu celular o selecciona el producto.</p>
    </div>

    <form method="POST" id="form-consumo">
        <div class="space-y-4">
            <!-- 1. Campo de Código de Barras y Botón de Cámara -->
            <div>
                <label class="block text-gray-700 font-medium mb-1 text-sm">Código de Barras</label>
                <div class="flex gap-2">
                    <input type="text" id="input-codigo" name="codigo_barras" placeholder="Escanea o escribe el código..." class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-pink-400 focus:outline-none text-sm">
                    <button type="button" id="btn-camara" class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-1 shadow-sm">
                        📷 Cámara
                    </button>
                </div>
                <p id="mensaje-producto" class="text-xs mt-1 text-gray-500">Usa la cámara del celular o escribe el código.</p>
            </div>

            <!-- Contenedor oculto para la vista previa de la cámara -->
            <div id="reader-container" class="hidden mt-3 p-3 bg-gray-50 rounded-xl border border-gray-200">
                <div id="reader" class="w-full"></div>
                <button type="button" id="btn-cerrar-camara" class="mt-2 w-full bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold py-1.5 px-3 rounded-lg transition">
                    Cerrar Cámara
                </button>
            </div>

            <!-- 2. Selector manual de respaldo -->
            <div>
                <label class="block text-gray-700 font-medium mb-1 text-sm">O Seleccionar Producto del Inventario</label>
                <select name="id_producto" id="select-producto" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-pink-400 focus:outline-none text-sm">
                    <option value="">-- Seleccione un producto --</option>
                    {% for prod in productos %}
                        <option value="{{ prod.id_producto }}" data-stock="{{ prod.stock_total_ml }}">
                            {{ prod.nombre }} (Stock actual: {{ prod.stock_total_ml }} ml)
                        </option>
                    {% endfor %}
                </select>
            </div>

            <!-- 3. Campo de Mililitros a Descontar -->
            <div>
                <label class="block text-gray-700 font-medium mb-1 text-sm">Mililitros (ml) Utilizados en el Servicio</label>
                <input type="number" step="0.1" name="mililitros" id="input-mililitros" required placeholder="Ej. 45" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-pink-400 focus:outline-none text-sm">
            </div>
        </div>

        <div class="mt-6">
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-4 rounded-xl transition shadow-sm text-sm">
                Registrar Consumo y Descontar (ml)
            </button>
        </div>
    </form>

    <div class="mt-4 text-center">
        <a href="{{ url_for('main.dashboard') }}" class="text-xs text-pink-600 hover:underline font-medium">← Volver al Dashboard</a>
    </div>
</div>

<!-- Librería externa para escanear códigos con la cámara (HTML5 QR Code) -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const inputCodigo = document.getElementById('input-codigo');
    const selectProducto = document.getElementById('select-producto');
    const mensajeProducto = document.getElementById('mensaje-producto');
    const btnCamara = document.getElementById('btn-camara');
    const readerContainer = document.getElementById('reader-container');
    const btnCerrarCamara = document.getElementById('btn-cerrar-camara');

    let html5QrCode = null;

    function buscarProductoPorCodigo(codigo) {
        if (!codigo) return;

        fetch(`/inventario/api/buscar?codigo=${encodeURIComponent(codigo)}`)
            .then(response => response.json())
            .then(data => {
                if (data.encontrado) {
                    selectProducto.value = data.id_producto;
                    mensajeProducto.innerHTML = `<span class="text-emerald-600 font-semibold">✔ Producto encontrado: ${data.nombre} (${data.stock_total_ml} ml disponibles)</span>`;
                } else {
                    mensajeProducto.innerHTML = `<span class="text-rose-600 font-semibold">✖ ${data.mensaje}</span>`;
                    selectProducto.value = "";
                }
            })
            .catch(error => {
                console.error('Error al buscar el producto:', error);
            });
    }

    // Evento al presionar Enter en el input de texto
    inputCodigo.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            buscarProductoPorCodigo(inputCodigo.value.trim());
        }
    });

    // Activar la cámara del celular al hacer clic en el botón
    btnCamara.addEventListener('click', function() {
        readerContainer.classList.remove('hidden');

        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }

        const config = { fps: 10, qrbox: { width: 250, height: 150 } };

        html5QrCode.start(
            { facingMode: "environment" }, // Usa la cámara trasera del celular
            config,
            (decodedText, decodedResult) => {
                // Cuando detecta un código de barras con éxito:
                inputCodigo.value = decodedText;
                buscarProductoPorCodigo(decodedText);

                // Detiene la cámara automáticamente tras leerlo
                html5QrCode.stop().then(() => {
                    readerContainer.classList.add('hidden');
                }).catch(err => console.error("Error al detener cámara", err));
            },
            (errorMessage) => {
                // Errores de escaneo continuo (se pueden ignorar ya que busca cuadro por cuadro)
            }
        ).catch(err => {
            alert("No se pudo acceder a la cámara. Asegúrate de dar permisos en tu navegador.");
            readerContainer.classList.add('hidden');
        });
    });

    // Botón para cerrar la cámara manualmente
    btnCerrarCamara.addEventListener('click', function() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                readerContainer.classList.add('hidden');
            }).catch(err => console.log(err));
        } else {
            readerContainer.classList.add('hidden');
        }
    });
});
</script>
{% endblock %}
