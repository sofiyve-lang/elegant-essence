{% extends "base.html" %}
{% block title %}Editar Usuario - Elegant Essence{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-pink-100">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">✏️ Editar Usuario</h2>

    <form method="POST">
        <div class="mb-4">
            <label class="block text-gray-700 font-medium mb-2">Nombre de Usuario</label>
            <input type="text" name="username" value="{{ usuario.username }}" required class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-pink-400 focus:outline-none">
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 font-medium mb-2">Rol del Sistema</label>
            <select name="id_rol" class="w-full px-3 py-2 border rounded-xl focus:ring-2 focus:ring-pink-400 focus:outline-none">
                {% for rol in roles %}
                    <option value="{{ rol.id_rol }}" {% if rol.id_rol == usuario.id_rol %}selected{% endif %}>
                        {{ rol.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-2.5 px-4 rounded-xl transition">
            Guardar Cambios
        </button>
    </form>

    <div class="mt-4 text-center">
        <a href="{{ url_for('main.dashboard') }}" class="text-sm text-pink-600 hover:underline">Volver al Dashboard</a>
    </div>
</div>
{% endblock %}
